<aside class="sidebar">
  <a class="brand" routerLink="/"><b>S</b> Sales<em>In</em></a>
  <nav aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">▣ <span>Dashboard</span></a>
    <a href="#">▦ <span>Appointments</span></a>
    <a href="#">♟ <span>Customers</span></a>
    <a routerLink="/items" routerLinkActive="active">▤ <span>Items</span></a>
    <a href="#">🛒 <span>Sales</span></a>
    <a href="#">▧ <span>Reports</span></a>
    <a href="#">▣ <span>B2B eCommerce</span></a>

  <div class="sidebar-user">
    @if (userImage(); as image) {
      <img class="user-avatar" [src]="image" alt="" />
    } @else {
      <span class="user-avatar user-avatar-fallback" aria-hidden="true">{{ userInitial() }}</span>
    }
    <span class="user-name">{{ userName() }}</span>
    <button type="button" (click)="signOut.emit()">Logout</button>
  </div>
</aside>
