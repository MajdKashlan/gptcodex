# ============================================================================
#  SalesIn -> ERPNext passthrough for a STATIC app.hmgtr.com site on aaPanel
# ============================================================================
#
#  Paste INSIDE the `server { ... }` block of:
#      /www/server/panel/vhost/nginx/app.hmgtr.com.conf
#
#  Then:  nginx -t && nginx -s reload
#
#  ---------------------------------------------------------------------------
#  WHY `^~` AND NOT A REGEX LOCATION
#  ---------------------------------------------------------------------------
#  A regex location such as
#      location ~ ^/(api|files|private|socket\.io)(/|$)
#  does NOT work reliably on aaPanel. aaPanel's default site config contains
#  regex locations for static file extensions, for example
#      location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { expires 30d; ... }
#  nginx matches regex locations in the order they appear, so
#      /files/favicon.png  ->  matched by the static rule  ->  404
#  even though
#      /files/             ->  reaches ERPNext correctly (301 to /files)
#  because the first has a file extension and the second does not.
#
#  A PREFIX location with `^~` overrides that: if it is the longest matching
#  prefix, nginx does not evaluate regex locations at all. So these blocks win
#  no matter where they sit in the file, and no matter what aaPanel adds later.
#
#  If you previously added a regex version of this block, DELETE it - do not keep
#  both.
#
#  Longest-prefix matching also means `^~ /files` covers /files, /files/ and
#  /files/favicon.png, including ERPNext's own 301 from /files/ to /files.
#
#  Every block repeats the same directives on purpose: nginx has no way to share
#  them without an extra `include` file, and a self-contained paste is safer.
# ============================================================================


# --- API --------------------------------------------------------------------
location ^~ /api {
    proxy_pass https://erp.hmgtr.com;

    # CRITICAL. Frappe decides which site to serve from the Host header. aaPanel's
    # own reverse-proxy feature injects `Host $host`, which would send
    # app.hmgtr.com and produce "site not found". This is the nginx equivalent of
    # `changeOrigin: true` in proxy.conf.json.
    proxy_set_header Host erp.hmgtr.com;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_ssl_server_name on;
    proxy_ssl_name erp.hmgtr.com;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;

    client_max_body_size 32m;
}

# --- Public files (item images, avatars, logos) ------------------------------
location ^~ /files {
    proxy_pass https://erp.hmgtr.com;
    proxy_set_header Host erp.hmgtr.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_ssl_name erp.hmgtr.com;
}

# --- Private files (require the ERPNext session cookie) ----------------------
# This works only because the app is same-origin: the browser sends the `sid`
# cookie to app.hmgtr.com, and nginx forwards it upstream.
location ^~ /private {
    proxy_pass https://erp.hmgtr.com;
    proxy_set_header Host erp.hmgtr.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_ssl_name erp.hmgtr.com;
}

# --- Realtime (optional until you use socket.io) -----------------------------
location ^~ /socket.io {
    proxy_pass https://erp.hmgtr.com;
    proxy_set_header Host erp.hmgtr.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_ssl_name erp.hmgtr.com;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 7d;
}

# Do NOT add CORS headers anywhere. The browser only ever talks to
# app.hmgtr.com, so no cross-origin request occurs - and extra
# Access-Control-Allow-Origin headers are what broke erp.hmgtr.com earlier.
